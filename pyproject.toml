# Nix supplies runtime dependencies. uv is available for isolated experiments;
# entering the shell or running workspace commands never creates a venv.
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.environment]
python-version = "3.11"
