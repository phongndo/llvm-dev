name: Workspace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      # Never realize the dev shell or compile uncached tool packages in CI.
      - name: Format and syntax
        run: |
          nix shell --inputs-from . nixpkgs#just nixpkgs#nixfmt --max-jobs 0 --command bash -euc '
            nixfmt --check flake.nix
            just --fmt --check
          '
          python3 -m py_compile scripts/prove.py
          for profile in dev debug validate; do cmake -P "cmake/$profile.cmake"; done
          git diff --check
      - name: Evaluate both platforms without building packages
        run: nix flake check --all-systems --no-build
