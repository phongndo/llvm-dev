name: LLVM integration (manual)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Host to verify (this compiles LLVM; expect a long run)
        required: true
        default: ubuntu-24.04
        type: choice
        options: [ubuntu-24.04, macos-15]

permissions:
  contents: read

jobs:
  llvm:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: phongndo/llvm-project
          ref: 90f7bc8fae2a8b9af3bce107632197299820e8aa
          path: llvm-project
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Configure and exercise a small middle-end build
        run: |
          mkdir -p .local
          printf 'projects = []\ntargets = ["X86"]\njobs = 2\nlink_jobs = 1\ntest_jobs = 2\n' > .local/config.toml
          nix develop --command bash -euo pipefail -c '
            just doctor
            just configure
            just build opt FileCheck count not split-file llvm-config
            just test llvm/test/Transforms/InstSimplify/add.ll --no-build
            just run opt -passes=instsimplify -S repros/instsimplify.ll | just run FileCheck repros/instsimplify.ll
          '
